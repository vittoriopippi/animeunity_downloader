# Builds the Docker image and pushes it to Docker Hub on every push to main.
# Needs one repository secret: DOCKERHUB_TOKEN (Docker Hub access token, Read & Write).
name: Docker image

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch: # "Run workflow" button in the Actions tab

concurrency:
  group: docker-image
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: vittoriopippi
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: vittoriopippi/animeunity-downloader
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
