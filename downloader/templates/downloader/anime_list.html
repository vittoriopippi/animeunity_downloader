{% extends 'downloader/base.html' %}

{% block content %}
<section class="card" style="--c:var(--purple)">
  <h2>ANIME LIST</h2>
  {% if animes %}
  <ul class="shows">
    {% for anime in animes %}
    <li>
      <a class="show" href="{% url 'anime_detail' anime.id %}">
        <span class="cover">{% if anime.cover_image %}<img src="{{ anime.cover_image }}" alt="" loading="lazy">{% endif %}</span>
        <span class="show-main">
          <span class="show-name">{{ anime.title }}</span>
          <span class="show-sub">{{ anime.episodes.count }} EPISODES</span>
        </span>
      </a>
    </li>
    {% endfor %}
  </ul>
  {% else %}
  <p class="empty">NO ANIME ADDED YET.</p>
  {% endif %}
</section>
{% endblock %}
