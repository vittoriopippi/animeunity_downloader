{% extends 'downloader/base.html' %}

{% block content %}
<section class="card" style="--c:var(--blue)">
  <h2>ADD BY URL</h2>
  <form method="post">
    {% csrf_token %}
    {% if form.non_field_errors %}<p class="ep-err">{{ form.non_field_errors|join:" " }}</p>{% endif %}
    <div class="field">
      <label for="{{ form.url.id_for_label }}">{{ form.url.label|upper }}</label>
      {{ form.url }}
      {{ form.url.errors }}
    </div>
    <button class="btn go" type="submit">ADD</button>
  </form>
</section>
{% endblock %}
